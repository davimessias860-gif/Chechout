[build]
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# These server-side checks remain closed until the operator completes validation.
# TOML values override the dashboard; change them here only after verification.
[context.production.environment]
  PAGARME_RECIPIENT_1 = "re_cmv88m9b67jxf0l9tqzl5w9pp"
  PAGARME_PRINCIPAL_CONFIRMED = "false"
  PAGARME_RECEIVABLES_CONFIRMED = "false"
